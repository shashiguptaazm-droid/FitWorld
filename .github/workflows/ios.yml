name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FitWorld.xcodeproj \
            -scheme FitWorld \
            -destination 'generic/platform=iOS'

      - name: Build archive
        run: |
          xcodebuild archive \
            -project FitWorld.xcodeproj \
            -scheme FitWorld \
            -archivePath FitWorld.xcarchive \
            -destination 'generic/platform=iOS' \
            -skipInstall SKIP_INSTALL=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p FitWorld-IPA/Payload
          cp -R FitWorld.xcarchive/Products/Applications/FitWorld.app FitWorld-IPA/Payload/
          cd FitWorld-IPA
          zip -qr FitWorld.ipa Payload
          rm -rf Payload
          ls -lh FitWorld.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitWorld-IPA
          path: FitWorld-IPA/*.ipa
          retention-days: 30

  test:
    runs-on: macos-14
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FitWorld.xcodeproj \
            -scheme FitWorld \
            -destination 'platform=iOS Simulator,name=iPhone 15'

      - name: Build & test (iPhone simulator)
        run: |
          xcodebuild test \
            -project FitWorld.xcodeproj \
            -scheme FitWorld \
            -destination 'platform=iOS Simulator,name=iPhone 15'
